<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Brick'It</title>
    <style>
        html, body { margin: 0; padding: 0; height: 100%; overflow: hidden; }
        body { background: #000000; display: flex; align-items: center; justify-content: center; }
        #game {
            aspect-ratio: 4 / 3;   /* matches ARENA_BOUNDS 800×600 */
            width: min(100vw, calc(100vh * 4 / 3));
            position: relative;
        }
        #game::after {             /* the walls: an overlay, since Compose's canvas paints over an outline */
            content: "";
            position: absolute;
            inset: 0;
            z-index: 1;
            border: 1px solid #00FF00;
            pointer-events: none;
        }
    </style>
</head>
<body>
    <div id="game"></div>
    <script>
        if (window.parent !== window) {
            const mounted = () => [...document.querySelectorAll('#game *')].some((el) => el.shadowRoot?.querySelector('canvas'));
            const poll = setInterval(() => {
                if (!mounted()) return;
                clearInterval(poll);
                setTimeout(() => window.parent.postMessage('brickit:ready', '*'), 150);
            }, 100);
        }
    </script>
    <script src="brickit.js"></script>
</body>
</html>
