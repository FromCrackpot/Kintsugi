<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Brick'It</title>
    <style>
        html, body { margin: 0; padding: 0; height: 100%; overflow: hidden; }
        body { background: #000000; display: flex; align-items: center; justify-content: center; }
        #game {
            aspect-ratio: 4 / 3;   /* matches ARENA_BOUNDS 800×600 */
            width: 800px;          /* natural (max) size */
            max-width: 100vw;      /* shrink to fit narrow windows */
            max-height: 100vh;     /* shrink to fit short windows */
        }
    </style>
</head>
<body>
    <div id="game"></div>
    <script>
        if (window.parent !== window) {
            const mounted = () => [...document.querySelectorAll('#game *')].some((el) => el.shadowRoot?.querySelector('canvas'));
            const poll = setInterval(() => {
                if (!mounted()) return;
                clearInterval(poll);
                setTimeout(() => window.parent.postMessage('brickit:ready', '*'), 150);
            }, 100);
        }
    </script>
    <script src="brickit.js"></script>
</body>
</html>
